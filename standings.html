<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class=standingshero>
        <title>SSNB Senior Boys Soccer West</title>
    </div>
    <link rel="stylesheet" href="style.css">
    <style>
        .table-container {
            padding: 30px;
            background-color: #000000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 20px solid #000000;
        }
        th, td {
            border: 1px solid #000000;
            padding: 8px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.2em;
        }
        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.85em;
            margin-top: 10px;
        }
    </style>
</head>

<body class="standings">
    <header>
      <div class="pill-box">
        <h1>SSNB Senior Boys West Soccer</h1>
        <h3>2026 Season</h3>
        <h5>Auto-updated from SSNB</h5>
      </div>
    </header>

    <div class="circle"></div>

    <div class="team-search">
        <label for="teamSearch">Find Your Team</label>
        <input type="text" id="teamSearch" placeholder="Search team...">
    </div>

    <div id="standings-container">
        <p class="loading">Loading standings...</p>
    </div>

    <div class="last-updated" id="lastUpdated"></div>

    <button type="button" id="showMoreButton">show more</button>
    <button type="button" id="showLessButton">show less</button>

    <script>
    async function loadStandings() {
        const container = document.getElementById('standings-container');

        try {
            const response = await fetch('standings.json?' + Date.now());
            const data = await response.json();

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="loading">No standings data available.</p>';
                return;
            }

            let html = '<table><thead><tr>';
            html += '<th>Pos</th><th>Team</th><th>PL</th><th>W</th><th>L</th><th>D</th><th>PTS</th>';
            html += '</tr></thead><tbody>';

            data.forEach(team => {
                const teamClass = team.team.toLowerCase().replace(/[^a-z]/g, '-').replace(/-+/g, '-');
                html += '<tr class="' + teamClass + '">';
                html += '<td>' + team.rank + '</td>';
                html += '<td>' + team.team + '</td>';
                html += '<td>' + team.gp + '</td>';
                html += '<td>' + team.w + '</td>';
                html += '<td>' + team.l + '</td>';
                html += '<td>' + team.t + '</td>';
                html += '<td>' + team.points + '</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;

            initSearch();
            initShowButtons();

            document.getElementById('lastUpdated').textContent =
                'Last updated: ' + new Date().toLocaleString();

        } catch (error) {
            container.innerHTML = '<p class="loading">Error loading standings. Please try again later.</p>';
            console.error('Error loading standings:', error);
        }
    }

    function initSearch() {
        const search = document.getElementById('teamSearch');
        search.addEventListener('input', function() {
            let value = search.value.toLowerCase();
            const rows = document.querySelectorAll('tbody tr');
            rows.forEach(row => {
                let team = row.children[1].textContent.toLowerCase();
                if (team.includes(value) && value !== "") {
                    row.style.outline = "3px solid white";
                    row.style.transform = "scale(1.03)";
                } else {
                    row.style.outline = "none";
                    row.style.transform = "scale(1)";
                }
            });
        });
    }

    function initShowButtons() {
        const rows = document.querySelectorAll('tbody tr');

        document.getElementById('showMoreButton').addEventListener('click', function() {
            rows.forEach(row => { row.style.display = ''; });
        });

        document.getElementById('showLessButton').addEventListener('click', function() {
            rows.forEach((row, index) => {
                if (index >= 7) { row.style.display = 'none'; }
            });
        });

        rows.forEach((row, index) => {
            if (index >= 7) { row.style.display = 'none'; }
        });
    }

    loadStandings();
    </script>
</body>

</html>
